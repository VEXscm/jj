# NOTE: ensure you update docs/revsets.md with documentation when
# adding/updating any of these aliases

[revsets]
arrange = "reachable(@, mutable())"
fix = "reachable(@, mutable())"
simplify-parents = "reachable(@, mutable())"
# log revset is also used as the default short-prefixes. If it failed to
# evaluate, lengthy warning messages would be printed. Use present(expr) if
# symbols in expr might not always exist.
log = "present(@) | ancestors(immutable_heads().., 2) | trunk()"
# Emit the working-copy branch first, which is usually most interesting.
# This also helps stabilize output order.
log-graph-prioritize = "present(@)"
op-diff-changes-in = "mutable() | immutable_heads()"
sign = "reachable(@, mutable())"
bookmark-advance-to = "@"
bookmark-advance-from = "heads(::to & bookmarks())"

[revset-aliases]
# trunk() can be overridden as '<bookmark>@<remote>', or per-repo via
#   vex config set --repo 'revset-aliases."trunk()"' '<bookmark>'
# (the import/clone flow writes that automatically; see vex-cli clone).
#
# Candidate remotes: Vex-native clones track `@vex` (not `@origin`). Git
# clones still use `@origin` / `@upstream`. After remote candidates we fall
# back to local main/master/trunk before giving up at root(). Without the
# `@vex` candidates, trunk() missed `master@vex` and either resolved to
# root() or — when a repo override set a bare `main` — warned on every
# command.
#
# `latest(...)` picks among whatever candidates exist (by committer time);
# the listing order is documentation / stability, not strict priority.
'trunk()' = '''
latest(
  remote_bookmarks(exact:"master", exact:"vex") |
  remote_bookmarks(exact:"main", exact:"vex") |
  remote_bookmarks(exact:"trunk", exact:"vex") |
  remote_bookmarks(exact:"main", exact:"origin") |
  remote_bookmarks(exact:"master", exact:"origin") |
  remote_bookmarks(exact:"trunk", exact:"origin") |
  remote_bookmarks(exact:"main", exact:"upstream") |
  remote_bookmarks(exact:"master", exact:"upstream") |
  remote_bookmarks(exact:"trunk", exact:"upstream") |
  bookmarks(exact:"master") |
  bookmarks(exact:"main") |
  bookmarks(exact:"trunk") |
  root()
)
'''

# If immutable_heads() failed to evaluate, many jj commands wouldn't work. Use
# present(expr) if symbols in expr might not always exist.
#
# `changes/*` and `stacks/*` are Vex review refs: remote-only current patchset
# tips (`changes/832@vex`), not published history. They are untracked, so the
# stock `untracked_remote_bookmarks()` set would freeze them and `vex edit`
# would refuse. Name-filter them out so an ordinary untracked `feature@vex` on
# the same commit still protects that commit.
'builtin_immutable_heads()' = 'trunk() | tags() | untracked_remote_bookmarks(~(glob:"changes/*" | glob:"refs/changes/*" | glob:"stacks/*" | glob:"refs/stacks/*"))'
'immutable_heads()' = 'builtin_immutable_heads()'
'immutable()' = '::(immutable_heads() | root())'
'mutable()' = '~immutable()'

'visible()' = '::visible_heads()'
'hidden()' = '~visible()'
